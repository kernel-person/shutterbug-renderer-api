site_name: ShutterBug Renderer API
site_description: Java consumer documentation for ShutterBug Renderer API v1.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
nav:
  - Overview: index.md
  - Operators:
      - Installation and activation: operator-guide.md
      - Compatibility: compatibility.md
      - Troubleshooting: troubleshooting.md
      - Upgrading: upgrading.md
      - Release notes: release-notes.md
  - Developers:
      - Maven and Gradle setup: setup.md
      - Lifecycle: lifecycle.md
      - Paper capture: capture.md
      - Manual scenes: manual-scenes.md
      - Assets: assets.md
      - Jobs and progress: jobs.md
      - Profiles and capabilities: profiles.md
      - Results and attachments: attachments.md
      - Conversions: conversions.md
      - Typed failures: failures.md
      - Threading: threading.md
      - Public API reference: api-reference.md
      - Complete sample: sample-walkthrough.md
site_dir: ../target/renderer-docs-site
